<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VTES Matchmaking</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Flatpickr CSS & JS (para selección de fecha/hora) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>

  <!-- 1. SDK Base de Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

  <!-- 2. SDK de Firebase App Check (Seguridad contra ejecución fuera de tu dominio) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>

  <!-- 3. SDK de Realtime Database -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4">

  <div class="max-w-5xl mx-auto space-y-8">
    
    <!-- Encabezado -->
    <header class="text-center py-6 border-b border-slate-800">
      <h1 class="text-4xl font-extrabold text-amber-500 tracking-wide">VTES Matchmaking</h1>
      <p class="text-slate-400 text-sm mt-1">Organizador de Mesas y Disponibilidad Individual para Vampire: The Eternal Struggle</p>
    </header>

    <!-- Zona Principal de Formularios -->
    <div class="grid md:grid-cols-2 gap-6">

      <!-- Formulario 1: Disponibilidad Personal -->
      <section class="bg-slate-800/80 p-5 rounded-xl border border-slate-700 shadow-xl space-y-4">
        <h2 class="text-xl font-bold text-amber-400 border-b border-slate-700 pb-2">Publicar Disponibilidad Personal</h2>
        <form id="availabilityForm" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Nick / Nombre</label>
            <input type="text" id="playerNick" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="Ej. Methuselah">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Fecha y Hora Local</label>
            <input type="text" id="localDateTime" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="Seleccionar fecha y hora...">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Plataforma</label>
            <select id="playerPlatform" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
              <option value="LackeyCCG">LackeyCCG</option>
              <option value="Jotsu">Jotsu</option>
              <option value="Tabletop Simulator">Tabletop Simulator</option>
              <option value="Otra">Otra</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">PIN de Eliminación (4 dígitos)</label>
            <input type="password" id="playerDeletePin" maxlength="4" pattern="[0-9]{4}" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="1234">
          </div>
          <button type="submit" id="submitBtn" class="w-full bg-red-700 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg transition duration-200 shadow-md text-sm mt-2">
            Publicar Hora
          </button>
        </form>
      </section>

      <!-- Formulario 2: Crear / Abrir Mesa -->
      <section class="bg-slate-800/80 p-5 rounded-xl border border-slate-700 shadow-xl space-y-4">
        <h2 class="text-xl font-bold text-amber-400 border-b border-slate-700 pb-2">Abrir Nueva Mesa</h2>
        <form id="customTableForm" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Nombre de la Mesa</label>
            <input type="text" id="tableName" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="Ej. Casual Casual Standard">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Creador / Nick</label>
              <input type="text" id="tableCreator" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="Tu Nick">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Plataforma</label>
              <select id="tablePlatform" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                <option value="LackeyCCG">LackeyCCG</option>
                <option value="Jotsu">Jotsu</option>
                <option value="Tabletop Simulator">Tabletop Simulator</option>
                <option value="Otra">Otra</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Fecha y Hora Local</label>
            <input type="text" id="tableDateTime" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="Seleccionar fecha y hora...">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Canal Discord / Link (Opcional)</label>
              <input type="text" id="tableDiscord" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="Servidor/Voz">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Password Partida (Opcional)</label>
              <input type="text" id="tableGamePassword" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="vtes123">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">PIN de Eliminación (4 dígitos)</label>
            <input type="password" id="tableDeletePin" maxlength="4" pattern="[0-9]{4}" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="1234">
          </div>
          <button type="submit" id="createTableBtn" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 px-4 rounded-lg transition duration-200 shadow-md text-sm mt-2">
            Abrir Mesa
          </button>
        </form>
      </section>

    </div>

    <!-- Sección de Registros Activos -->
    <section class="bg-slate-800/80 p-5 rounded-xl border border-slate-700 shadow-xl space-y-4">
      <h2 class="text-2xl font-bold text-amber-400 border-b border-slate-700 pb-2">Mesas y Jugadores Disponibles</h2>
      <div id="recordsList" class="grid gap-4 md:grid-cols-2">
        <p class="text-slate-400 text-sm col-span-2 text-center py-4">Cargando registros en tiempo real...</p>
      </div>
    </section>

  </div>

  <script>
    // =========================================================================
    // 1. CONFIGURACIÓN DE FIREBASE
    // Coloca tus datos exactos de la consola de Firebase
    // =========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyBQR7AaxC5F2bTKI_po7w7awZLa_KVS4zk",
      authDomain: "vtes-uat.firebaseapp.com",
      databaseURL: "https://vtes-uat-default-rtdb.firebaseio.com",
      projectId: "vtes-uat",
      storageBucket: "vtes-uat.firebasestorage.app",
      messagingSenderId: "801358504439",
      appId: "1:801358504439:web:d946e61ff0067bee69cef2"
    };

    // =========================================================================
    // 2. INICIALIZACIÓN DE FIREBASE Y APP CHECK (SEGURIDAD RECAPTCHA V3)
    // =========================================================================
    firebase.initializeApp(firebaseConfig);

    // Activar la protección App Check
    const appCheck = firebase.appCheck();
    appCheck.activate(
      new firebase.appCheck.ReCaptchaV3Provider('6LfWd7YtAAAAAMg-IhiLw8ukgxp2ejhX-i7RaBl-'),
      true // Autorrefresco automático del token de atestación
    );

    // Instancia de la base de datos protegida
    const database = firebase.database();
    const recordsRef = database.ref('vtes_records');

    // Detectar zona horaria local
    const userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

    // Inicializar selectores de fecha Flatpickr
    const pickerAvailability = flatpickr("#localDateTime", {
      enableTime: true,
      dateFormat: "Y-m-d H:i",
      minDate: "today",
      locale: "es"
    });

    const pickerCustomTable = flatpickr("#tableDateTime", {
      enableTime: true,
      dateFormat: "Y-m-d H:i",
      minDate: "today",
      locale: "es"
    });

    // =========================================================================
    // 3. ENVÍO DE DISPONIBILIDAD INDIVIDUAL
    // =========================================================================
    document.getElementById('availabilityForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const nick = document.getElementById('playerNick').value.trim();
      const localInput = document.getElementById('localDateTime').value;
      const platform = document.getElementById('playerPlatform').value;
      const deletePin = document.getElementById('playerDeletePin').value.trim();

      if (!localInput) return alert('Selecciona una fecha y hora.');

      const selectedDate = new Date(localInput.replace(' ', 'T'));
      if (isNaN(selectedDate.getTime())) return alert('❌ Formato de fecha/hora inválido.');

      const newRef = recordsRef.push();
      const newId = newRef.key;

      localStorage.setItem(`vtes_owner_${newId}`, nick.toLowerCase());

      newRef.set({
        type: 'individual',
        nick: nick,
        platform: platform,
        utcTime: selectedDate.toISOString(),
        deletePin: deletePin,
        originTz: userTimezone
      }, function(error) {
        if (error) {
          alert('❌ Error al guardar (Bloqueado por seguridad o conexión): ' + error.message);
        } else {
          document.getElementById('availabilityForm').reset();
          pickerAvailability.clear();
        }
      });
    });

    // =========================================================================
    // 4. ENVÍO DE CREACIÓN DE MESA
    // =========================================================================
    document.getElementById('customTableForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('tableName').value.trim();
      const localInput = document.getElementById('tableDateTime').value;
      const creator = document.getElementById('tableCreator').value.trim();
      const platform = document.getElementById('tablePlatform').value;
      const discord = document.getElementById('tableDiscord').value.trim();
      const gamePassword = document.getElementById('tableGamePassword').value.trim();
      const deletePin = document.getElementById('tableDeletePin').value.trim();

      if (!localInput) return alert('Selecciona una fecha y hora.');

      const selectedDate = new Date(localInput.replace(' ', 'T'));
      if (isNaN(selectedDate.getTime())) return alert('❌ Formato de fecha/hora inválido.');

      const newRef = recordsRef.push();
      const newId = newRef.key;

      localStorage.setItem(`vtes_owner_${newId}`, creator.toLowerCase());

      newRef.set({
        type: 'custom_table',
        name: name,
        utcTime: selectedDate.toISOString(),
        players: [creator],
        platform: platform,
        discord: discord || '',
        gamePassword: gamePassword || '',
        deletePin: deletePin,
        originTz: userTimezone
      }, function(error) {
        if (error) {
          alert('❌ Error al guardar (Bloqueado por seguridad o conexión): ' + error.message);
        } else {
          document.getElementById('customTableForm').reset();
          pickerCustomTable.clear();
        }
      });
    });

    // =========================================================================
    // 5. ESCUCHADOR EN TIEMPO REAL Y RENDERIZADO
    // =========================================================================
    recordsRef.on('value', function(snapshot) {
      const recordsList = document.getElementById('recordsList');
      recordsList.innerHTML = '';

      const data = snapshot.val();
      if (!data) {
        recordsList.innerHTML = '<p class="text-slate-400 text-sm col-span-2 text-center py-4">No hay mesas ni jugadores registrados en este momento.</p>';
        return;
      }

      const now = new Date();

      Object.keys(data).forEach(function(key) {
        const item = data[key];
        const itemDate = new Date(item.utcTime);

        // Limpieza automática visual de eventos pasados (+3 horas de gracia)
        if (now - itemDate > 3 * 60 * 60 * 1000) return;

        const formattedDate = itemDate.toLocaleString([], {
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit'
        });

        const card = document.createElement('div');
        card.className = 'bg-slate-900 border border-slate-700 rounded-lg p-4 space-y-3 relative shadow';

        if (item.type === 'individual') {
          card.innerHTML = `
            <div class="flex justify-between items-start">
              <div>
                <span class="text-xs bg-red-900/60 text-red-300 font-bold px-2 py-0.5 rounded">Jugador Disponible</span>
                <h3 class="text-lg font-bold text-slate-100 mt-1">${escapeHtml(item.nick)}</h3>
              </div>
              <button onclick="deleteRecord('${key}', '${item.deletePin}')" class="text-xs bg-slate-800 hover:bg-red-900 text-slate-400 hover:text-red-200 px-2 py-1 rounded transition">Eliminar</button>
            </div>
            <p class="text-xs text-slate-400">📅 <strong>Hora:</strong> ${formattedDate}</p>
            <p class="text-xs text-slate-400">💻 <strong>Plataforma:</strong> ${escapeHtml(item.platform)}</p>
          `;
        } else if (item.type === 'custom_table') {
          const playersCount = item.players ? item.players.length : 0;
          const playersList = item.players ? item.players.map(p => escapeHtml(p)).join(', ') : '';

          card.innerHTML = `
            <div class="flex justify-between items-start">
              <div>
                <span class="text-xs bg-amber-900/60 text-amber-300 font-bold px-2 py-0.5 rounded">Mesa ${playersCount}/5</span>
                <h3 class="text-lg font-bold text-slate-100 mt-1">${escapeHtml(item.name)}</h3>
              </div>
              <button onclick="deleteRecord('${key}', '${item.deletePin}')" class="text-xs bg-slate-800 hover:bg-red-900 text-slate-400 hover:text-red-200 px-2 py-1 rounded transition">Eliminar</button>
            </div>
            <p class="text-xs text-slate-400">📅 <strong>Hora:</strong> ${formattedDate}</p>
            <p class="text-xs text-slate-400">💻 <strong>Plataforma:</strong> ${escapeHtml(item.platform)}</p>
            <p class="text-xs text-slate-400">👥 <strong>Jugadores (${playersCount}/5):</strong> ${playersList}</p>
            ${item.discord ? `<p class="text-xs text-slate-400">💬 <strong>Discord:</strong> ${escapeHtml(item.discord)}</p>` : ''}
            ${item.gamePassword ? `<p class="text-xs text-slate-400">🔑 <strong>Password:</strong> ${escapeHtml(item.gamePassword)}</p>` : ''}
            ${playersCount < 5 ? `<button onclick="joinTable('${key}')" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-1.5 px-3 rounded-lg text-xs transition mt-2">Unirse a la Mesa</button>` : '<p class="text-xs text-emerald-400 font-bold mt-2">¡Mesa Llena!</p>'}
          `;
        }

        recordsList.appendChild(card);
      });
    });

    // =========================================================================
    // 6. FUNCIONES DE INTERACCIÓN (UNIRSE Y ELIMINAR CON PIN)
    // =========================================================================
    function joinTable(key) {
      const nick = prompt("Ingresa tu Nick para unirte a la mesa:");
      if (!nick || !nick.trim()) return;

      const recordRef = database.ref(`vtes_records/${key}`);
      recordRef.transaction(function(currentData) {
        if (currentData) {
          if (!currentData.players) currentData.players = [];
          if (currentData.players.length >= 5) return; // Mesa llena
          if (!currentData.players.includes(nick.trim())) {
            currentData.players.push(nick.trim());
          }
        }
        return currentData;
      });
    }

    function deleteRecord(key, correctPin) {
      const pin = prompt("Ingresa el PIN de 4 dígitos para eliminar esta entrada:");
      if (pin === null) return;

      if (pin.trim() === correctPin) {
        database.ref(`vtes_records/${key}`).remove()
          .then(() => alert("✅ Entrada eliminada correctamente."))
          .catch((err) => alert("❌ Error al eliminar: " + err.message));
      } else {
        alert("❌ PIN incorrecto.");
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
